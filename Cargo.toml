[package]
name = "open-agent-network"
version = "0.12.0"
edition = "2024"
description = "Open Agent Network: a self-hosted team directory and message bus for coding agents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/compuficial/open-agent-network"
publish = false

[[bin]]
name = "oan"
path = "src/main.rs"

[features]
default = ["selfhost"]
# Marks this fork's fail-closed build. Turning it off does not restore public relays.
selfhost = []

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
cliclack = "0.5"
data-encoding = "2"
deunicode = { version = "=1.6.2", default-features = false }
futures-lite = "2"
getrandom = "0.3"
iroh = "1.3"
iroh-mdns-address-lookup = "0.6"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
ring = "0.17"
rmcp = { version = "3.5", features = ["server", "macros", "transport-io"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rustls-pki-types = "1.15.1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
toml = "0.9"
toml_edit = "0.25"
ulid = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
console = "0.16"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Pipes", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.26", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSEvent", "NSImage", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSCell", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDate", "NSString", "NSRunLoop", "NSObjCRuntime"] }

[dev-dependencies]
iroh-relay = { version = "=1.3.0", default-features = false, features = ["server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
